<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>폰으로 열기</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    background:#f5f6f8;color:#1b2230;min-height:100vh;
    display:flex;align-items:center;justify-content:center;padding:24px;
  }
  .card{
    background:#fff;border-radius:20px;padding:34px 30px;text-align:center;
    box-shadow:0 6px 28px rgba(20,30,50,.09);max-width:420px;width:100%;
  }
  h1{font-size:22px;font-weight:800;letter-spacing:-.5px}
  .sub{font-size:13.5px;color:#6b7280;margin-top:6px;line-height:1.6}
  img{width:250px;height:250px;margin:22px 0 8px;display:block;margin-left:auto;margin-right:auto}
  .url{
    font-size:14px;font-family:ui-monospace,Menlo,Consolas,monospace;
    background:#f1f3f7;border-radius:10px;padding:11px;word-break:break-all;
    color:#0b7d58;font-weight:600;
  }
  ol{text-align:left;margin-top:22px;padding-left:20px;font-size:13.5px;line-height:1.85;color:#374151}
  ol b{color:#0ea472}
  .note{
    margin-top:18px;background:#e8f7f1;border-radius:12px;padding:13px 15px;
    font-size:12.5px;color:#12694d;line-height:1.65;text-align:left;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>📱 폰으로 열기</h1>
    <div class="sub">폰 카메라로 아래 QR을 비추세요</div>
    <img src="qr.png" alt="앱 주소 QR코드">
    <div class="url">clddy.github.io/trash-map/app</div>

    <ol>
      <li>QR을 찍으면 브라우저가 열립니다</li>
      <li>안드로이드는 <b>⋮ → 홈 화면에 추가</b><br>
          아이폰은 <b>공유 → 홈 화면에 추가</b></li>
      <li>홈에 생긴 아이콘으로 들어가면 앱처럼 뜹니다</li>
      <li>앱에서 <b>설정 탭</b> → 우리 동네 선택</li>
    </ol>

    <div class="note">
      QR이 안 찍히면 폰 브라우저 주소창에 위 주소를 직접 치셔도 됩니다.
      네이버·다음 앱 말고 <b>크롬이나 사파리</b>로 여셔야 홈 화면 추가가 됩니다.
    </div>
  </div>
</body>
</html>
